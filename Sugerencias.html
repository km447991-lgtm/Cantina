<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/Sugerencias.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugerencias</title>
</head>
<body> <a href="index.html"><img src="Assets/back.png" alt="Salir" class="flechasugerencias"></a>
</body>
</html>
<style>
        body {
            background: #f3f7f4;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .caja-sugerencias {
            background: #fff;
            width: 90%;
            max-width: 501px;
            padding: 24px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            resize: vertical;
            padding: 12px;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="caja-sugerencias">
        <h1>Sugerencias</h1>

        <form>
            <label for="sugerencia">Escribe tu sugerencia:</label>
            <textarea id="sugerencia" name="sugerencia" placeholder="Escribe aquí tu comentario o sugerencia..."></textarea>
            <button type="submit">Enviar</button>
        </form>
    </div>
</body>
</html>
